<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1F2A" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Content-Security-Policy (client-side baseline).
      A meta CSP can't set every directive (no frame-ancestors / report-to) and
      can't drop 'unsafe-eval', which Vite's dev-mode HMR client needs — so
      treat this as a floor, not the final word. A production deployment
      should serve an equal-or-stricter policy as a real HTTP response header
      from the edge/CDN, without 'unsafe-eval', plus HSTS and the framing and
      reporting directives a meta tag cannot express. See docs/SECURITY.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'self';
        script-src 'self' 'unsafe-eval';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self' ws: wss: http://localhost:3001 ws://localhost:3001 https://projectbank-production.up.railway.app;
        manifest-src 'self';
        worker-src 'self'"
    />

    <title>Nisos — Everything Cyprus. One secure app.</title>
    <meta
      name="description"
      content="Nisos is a Cyprus super-app prototype: digital identity, government services, money and payments in one secure design."
    />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nisos" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
